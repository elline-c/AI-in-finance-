<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Statement Screening{% endblock %}</title>
  <style>
    :root { --bg:#0f1720; --panel:#182430; --ink:#e7edf3; --muted:#8fa3b3; --line:#26333f; --accent:#3b82f6; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
           background:var(--bg); color:var(--ink); }
    a { color:var(--accent); text-decoration:none; }
    header { padding:16px 24px; border-bottom:1px solid var(--line); display:flex;
             align-items:center; gap:12px; background:var(--panel); }
    header h1 { font-size:16px; margin:0; font-weight:600; }
    header .tag { font-size:11px; color:var(--muted); border:1px solid var(--line);
                  padding:2px 8px; border-radius:999px; }
    main { padding:24px; max-width:1100px; margin:0 auto; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:12px;
             padding:18px 20px; margin-bottom:18px; }
    table { width:100%; border-collapse:collapse; font-size:14px; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); }
    th { color:var(--muted); font-weight:600; font-size:12px; text-transform:uppercase; letter-spacing:.04em; }
    .pill { display:inline-block; padding:2px 10px; border-radius:999px; font-size:12px;
            font-weight:700; color:#fff; }
    .muted { color:var(--muted); }
    .score { font-size:34px; font-weight:800; line-height:1; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
    .kv { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line); font-size:14px; }
    .btn { display:inline-block; padding:9px 16px; border-radius:8px; border:1px solid var(--line);
           background:#22303c; color:var(--ink); cursor:pointer; font-size:14px; }
    .btn.primary { background:var(--accent); border-color:var(--accent); }
    .btn.danger { background:#c62828; border-color:#c62828; }
    .btn.ok { background:#2e7d32; border-color:#2e7d32; }
    input, textarea, select { width:100%; padding:9px 11px; background:#0d151d; color:var(--ink);
             border:1px solid var(--line); border-radius:8px; font-size:14px; }
    label { font-size:12px; color:var(--muted); display:block; margin:10px 0 4px; }
    .sev-HIGH { color:#ff8a80; } .sev-MEDIUM { color:#ffd54f; } .sev-LOW { color:#a5d6a7; } .sev-INFO { color:#90caf9; }
    code { background:#0d151d; padding:1px 6px; border-radius:5px; font-size:12px; }
    .evidence { font-size:13px; color:#c9d6e0; margin-top:4px; }
  </style>
</head>
<body>
  <header>
    <h1>🛡️ Bank Statement Tampering Screening</h1>
    <span class="tag">4-agent pipeline</span>
    <span class="tag">human-in-the-loop</span>
    <span style="flex:1"></span>
    <a href="/">Dashboard</a>
  </header>
  <main>{% block body %}{% endblock %}</main>
</body>
</html>
